<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>YanMuhasebe</title><meta name="robots" content="noindex">
<script>
/* Alt adresler (örn. /musteriler-cari-menusu/detay/ID/) için: yolu ?p= olarak ana sayfaya taşır */
(function(){var l=location,keep=/github\.io$/.test(l.hostname)?1:0,seg=l.pathname.split('/').filter(Boolean);
var base='/'+seg.slice(0,keep).join('/');if(base.slice(-1)!=='/')base+='/';
var rest=seg.slice(keep).join('/').replace(/index\.html$/,'');
l.replace(l.origin+base+(rest?'?p='+rest:'')+l.hash);})();
</script></head><body></body></html>
