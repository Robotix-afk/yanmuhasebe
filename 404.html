<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YanMuhasebe</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e2e8f0}
  .box{text-align:center;padding:24px}
  .logo{font-weight:800;font-size:22px;letter-spacing:.02em;margin-bottom:8px}
  .logo span{color:#a3e635}
  p{color:#94a3b8;font-size:14px;margin:0}
  .spin{width:28px;height:28px;border:3px solid #334155;border-top-color:#a3e635;border-radius:50%;
    margin:16px auto 0;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
<script>
/* GitHub Pages 404 → SPA yönlendirici */
(function () {
  var l = location;
  var host = l.hostname || '';
  var keep = /github\.io$/i.test(host) ? 1 : 0;
  var seg = l.pathname.split('/').filter(Boolean);
  var baseSegs = seg.slice(0, keep);
  var base = '/' + baseSegs.join('/');
  if (base.slice(-1) !== '/') base += '/';
  var rest = seg.slice(keep).join('/').replace(/\/?(index|404)\.html$/i, '').replace(/\/+$/, '');
  var restLower = (rest || '').toLowerCase();
  var hash = l.hash || '';

  if (restLower === 'yanmali' || restLower.indexOf('yanmali/') === 0) {
    var sub = restLower === 'yanmali' ? '' : rest.slice(rest.toLowerCase().indexOf('yanmali') + 7).replace(/^\/+/, '');
    var h = '';
    if (sub) {
      if (/giris|login/i.test(sub)) h = '/giris';
      else if (/kayit|register/i.test(sub)) h = '/kayit';
      else h = '/' + sub.replace(/\/+$/, '');
    }
    l.replace(l.origin + base + 'yanmali.html' + (h || hash || ''));
    return;
  }

  var aliases = {
    'kayit-ol': 'kayit-ol', 'kayit': 'kayit-ol', 'register': 'kayit-ol',
    'giris-yap': 'giris-yap', 'giris': 'giris-yap', 'login': 'giris-yap',
    'takvim': 'takvim', 'calendar': 'takvim',
    'musteriler': 'musteriler', 'cariler-musteriler': 'musteriler',
    'tedarikciler': 'tedarikciler', 'urunler': 'urunler',
    'satislar': 'satislar', 'alislar': 'alislar',
    'hesaplarim': 'hesaplar', 'hesaplar': 'hesaplar',
    'masraflar': 'masraflar', 'raporlar': 'raporlar', 'ayarlar': 'ayarlar',
    'destek': 'destek', 'yardim': 'destek',
    'e-ticaret': 'eticaret', 'eticaret': 'eticaret',
    'depolar': 'depolar', 'calisanlar': 'calisanlar',
    'kredi': 'kredi', 'krediler': 'kredi',
    'fatura': 'fatura', 'efatura': 'efatura',
    'profil': 'profilim', 'profilim': 'profilim'
  };

  if (!rest) {
    l.replace(l.origin + base + (hash || ''));
    return;
  }

  var first = restLower.split('/')[0];
  var mapped = aliases[first] || rest;
  var q = '?p=' + encodeURIComponent(mapped);
  l.replace(l.origin + base + q + hash);
})();
</script>
</head>
<body>
  <div class="box">
    <div class="logo">Yan<span>Muhasebe</span></div>
    <p>Yonlendiriliyor...</p>
    <div class="spin" aria-hidden="true"></div>
  </div>
</body>
</html>
