<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>YanMuhasebe</title>
<meta name="robots" content="noindex">
<script>
/* GitHub Pages: alt yolları index.html veya yanmali.html'e yönlendirir.
   Örnekler:
   /yanmuhasebe/satislar/          → /yanmuhasebe/?p=satislar
   /yanmuhasebe/musteriler-cari-menusu/ → /yanmuhasebe/?p=musteriler-cari-menusu
   /yanmuhasebe/yanmali/           → /yanmuhasebe/yanmali.html
   /yanmuhasebe/yanmali/giris      → /yanmuhasebe/yanmali.html#/giris
   /yanmuhasebe/yanmali/kayit      → /yanmuhasebe/yanmali.html#/kayit
*/
(function () {
  var l = location;
  var host = l.hostname || '';
  var keep = /github\.io$/i.test(host) ? 1 : 0;
  var seg = l.pathname.split('/').filter(Boolean);
  var baseSegs = seg.slice(0, keep);
  var base = '/' + baseSegs.join('/');
  if (base.slice(-1) !== '/') base += '/';
  var rest = seg.slice(keep).join('/').replace(/\/?(index|404)\.html$/i, '').replace(/\/+$/, '');
  var restLower = rest.toLowerCase();
  var hash = l.hash || '';

  var yanmaliRoots = ['yanmali', 'yan-mali', 'mali-musavir', 'malimusavir'];
  var first = (restLower.split('/')[0] || '');
  var isYanmali = yanmaliRoots.indexOf(first) >= 0;

  if (!isYanmali && (restLower === 'giris-mali' || restLower === 'kayit-mali')) {
    isYanmali = true;
    rest = restLower === 'giris-mali' ? 'yanmali/giris' : 'yanmali/kayit';
    restLower = rest;
    first = 'yanmali';
  }

  if (isYanmali) {
    var sub = restLower.split('/').slice(1).join('/');
    var map = {
      '': '/',
      'giris': '/giris',
      'giris-yap': '/giris',
      'login': '/giris',
      'kayit': '/kayit',
      'kayit-ol': '/kayit',
      'register': '/kayit',
      'mukellefler': '/mukellefler',
      'calisanlar': '/calisanlar',
      'sifre': '/sifre',
      'yardim': '/yardim'
    };
    var h = map[sub] != null ? map[sub] : (sub ? '/' + sub : '/');
    var target = l.origin + base + 'yanmali.html' + (h && h !== '/' ? '#' + h : '');
    l.replace(target);
    return;
  }

  if (!rest) {
    l.replace(l.origin + base + (hash || ''));
    return;
  }

  var q = '?p=' + encodeURIComponent(rest);
  l.replace(l.origin + base + q + hash);
})();
</script>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:40px;color:#64748b">Yonlendiriliyor...</p>
</body>
</html>
